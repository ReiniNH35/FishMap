<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gewässer-Tracker & Karte</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 15px; background: #f0f2f5; color: #333; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h1 { margin-top: 0; color: #007aff; font-size: 24px; text-align: center; }
        button { background: #007aff; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; -webkit-tap-highlight-color: transparent; }
        button:active { background: #0056b3; }
        .btn-secondary { background: #34c759; }
        .btn-secondary:active { background: #248a3d; }
        .btn-danger { background: #ff3b30; }
        .btn-danger:active { background: #c61a09; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        .status { padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: bold; background: #e5e5ea; }
        .error { background: #ffdee2; color: #ff3b30; border: 1px solid #ff3b30; }
        .success { background: #e3ffd9; color: #34c759; border: 1px solid #34c759; }
        #map { height: 350px; width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ccc; z-index: 1; }
        .depth-label { background: rgba(0, 122, 255, 0.9); color: white; border: 1px solid white; border-radius: 4px; padding: 2px 5px; font-size: 11px; font-weight: bold; text-align: center; white-space: nowrap; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f2f2f7; font-weight: 600; }
        .flex-buttons { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>📍 Gewässer-Tracker</h1>
    <div id="statusBar" class="status">Bereit zum Erfassen</div>
    <button id="gpsBtn">1. GPS-Position erfassen</button>
    <div style="margin: 15px 0; line-height: 1.6; font-size: 14px;">
        <strong>Breitengrad (Lat):</strong> <span id="latText">-</span> | 
        <strong>Längengrad (Lng):</strong> <span id="lngText">-</span><br>
        <strong>Genauigkeit:</strong> <span id="accText">-</span>
    </div>
    <label for="depthInput"><strong>2. Wassertiefe (in Metern):</strong></label>
    <input type="number" id="depthInput" step="0.1" placeholder="z.B. 4.5" pattern="[0-9]*" inputmode="decimal">
    <button id="saveBtn" class="btn-secondary" disabled>3. Punkt speichern</button>
</div>

<div class="card">
    <h3>🗺️ Deine Gewässerkarte</h3>
    <div id="map"></div>
</div>

<div class="card">
    <h3>Gespeicherte Punkte (<span id="countText">0</span>)</h3>
    <div class="flex-buttons">
        <button id="exportBtn" style="background: #5856d6;">📊 Als CSV exportieren</button>
        <button id="clearBtn" class="btn-danger">⚠️ Alle löschen</button>
    </div>
    <div style="overflow-x:auto;">
        <table id="pointsTable">
            <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Lat</th>
                    <th>Lng</th>
                    <th>Tiefe</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="https://unpkg.com"></script>
<script>
let currentLat = null;
let currentLng = null;
let savedPoints = JSON.parse(localStorage.getItem('fishMapPoints')) || [];
let map, markerLayer;

const statusBar = document.getElementById('statusBar');
const latText = document.getElementById('latText');
const lngText = document.getElementById('lngText');
const accText = document.getElementById('accText');
const depthInput = document.getElementById('depthInput');
const gpsBtn = document.getElementById('gpsBtn');
const saveBtn = document.getElementById('saveBtn');
const exportBtn = document.getElementById('exportBtn');
const clearBtn = document.getElementById('clearBtn');
const pointsTable = document.getElementById('pointsTable').getElementsByTagName('tbody');
const countText = document.getElementById('countText');

function initMap() {
    map = L.map('map').setView([50.0, 10.0], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
    updateMapMarkers();
}

function updateMapMarkers() {
    if (!map) return;
    markerLayer.clearLayers();
    if (savedPoints.length === 0) return;
    
    let latLngs = [];
    savedPoints.forEach(p => {
        const pos = [p.lat, p.lng];
        latLngs.push(pos);
        
        L.marker(pos)
            .addTo(markerLayer)
            .bindPopup('<b>Zeit:</b> ' + p.time + '<br><b>Tiefe:</b> ' + p.depth + 'm')
            .bindTooltip(p.depth + 'm', {
                permanent: true, 
                direction: 'top',
                className: 'depth-label',
                offset: [0, -10]
            });
    });
    
    const bounds = L.latLngBounds(latLngs);
    map.fitBounds(bounds, { padding: [30, 30] });
}

function updateTable() {
    pointsTable.innerHTML = '';
    countText.innerText = savedPoints.length;
    savedPoints.forEach(p => {
        let row = pointsTable.insertRow(0);
        row.insertCell(0).innerText = p.time;
        row.insertCell(1).innerText = p.lat.toFixed(5);
        row.insertCell(2).innerText = p.lng.toFixed(5);
        row.insertCell(3).innerText = p.depth + 'm';
    });
}

gpsBtn.addEventListener('click', function() {
    statusBar.className = "status";
    statusBar.innerText = "Suche Satelliten... Bitte warten...";
    if (!navigator.geolocation) {
        statusBar.className = "status error";
        statusBar.innerText = "Fehler: Geolocation wird nicht unterstützt!";
        return;
    }
    navigator.geolocation.getCurrentPosition(
        function(position) {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            latText.innerText = currentLat.toFixed(5);
            lngText.innerText = currentLng.toFixed(5);
            accText.innerText = "+/- " + Math.round(position.coords.accuracy) + " Meter";
            statusBar.className = "status success";
            statusBar.innerText = "Position erfolgreich erfasst!";
            saveBtn.disabled = false;
            map.setView([currentLat, currentLng], 16);
            depthInput.focus();
        },
        function(error) {
            statusBar.className = "status error";
            if (error.code === 1) statusBar.innerText = "Fehler 1: Zugriff verweigert!";
            else if (error.code === 2) statusBar.innerText = "Fehler 2: Kein GPS Signal.";
            else if (error.code === 3) statusBar.innerText = "Fehler 3: Zeitüberschreitung.";
            else statusBar.innerText = "Fehler: " + error.message;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
});

saveBtn.addEventListener('click', function() {
    const depth = depthInput.value.trim();
    if (!depth || isNaN(depth)) {
        alert("Bitte trage eine gültige Wassertiefe ein!");
        return;
    }
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    const point = { time: timeStr, lat: currentLat, lng: currentLng, depth: depth };
    savedPoints.push(point);
    localStorage.setItem('fishMapPoints', JSON.stringify(savedPoints));
    
    updateTable();
    updateMapMarkers();
    
    depthInput.value = '';
    saveBtn.disabled = true;
    latText.innerText = '-';
    lngText.innerText = '-';
    accText.innerText = '-';
    currentLat = null;
    currentLng = null;
    statusBar.className = "status";
    statusBar.innerText = "Punkt gespeichert!";
});

exportBtn.addEventListener('click', function() {
    if (savedPoints.length === 0) {
        alert("Keine Punkte zum Exportieren vorhanden!");
        return;
    }
    let csvContent = "data:text/csv;charset=utf-8,Zeit,Breitengrad(Lat),Laengengrad(Lng),Wassertiefe(m)\n";
    savedPoints.forEach(p => { csvContent += p.time + "," + p.lat + "," + p.lng + "," + p.depth + "\n"; });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "gewaesser_karte_export.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});

clearBtn.addEventListener('click', function() {
    if (confirm("Wirklich ALLE Punkte löschen?")) {
        savedPoints = [];
        localStorage.removeItem('fishMapPoints');
        updateTable();
        updateMapMarkers();
        statusBar.className = "status";
        statusBar.innerText = "Alle Daten gelöscht.";
    }
});

initMap();
updateTable();
</script>
</body>
</html>
