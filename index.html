<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gewässer-Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f0f2f5; color: #333; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h1 { margin-top: 0; color: #007aff; font-size: 24px; text-align: center; }
        button { background: #007aff; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button:active { background: #0056b3; }
        .btn-secondary { background: #34c759; }
        .btn-secondary:active { background: #248a3d; }
        .btn-danger { background: #ff3b30; }
        .btn-danger:active { background: #c61a09; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group button { flex: 1; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; background: white; }
        .status { padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: bold; background: #e5e5ea; display: none; }
        .error { background: #ffdee2; color: #ff3b30; border: 1px solid #ff3b30; display: block; }
        .success { background: #e3ffd9; color: #34c759; border: 1px solid #34c759; display: block; }
        #map { height: 350px; width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ccc; z-index: 1; }
        .depth-label { background: rgba(0, 122, 255, 0.9); color: white; border: 1px solid white; border-radius: 4px; padding: 2px 5px; font-size: 11px; font-weight: bold; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #f8f9fa; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .badge { background: #e5e5ea; color: #333; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: normal; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gewässer-Tracker</h1>
        <div id="statusBox" class="status"></div>
        
        <label for="depthInput"><strong>Wassertiefe (Meter):</strong></label>
        <input type="number" id="depthInput" step="0.1" placeholder="z.B. 4.5" pattern="[0-9]*" inputmode="decimal">
        
        <label for="accuracyFilter"><strong>Erforderliche GPS-Genauigkeit:</strong></label>
        <select id="accuracyFilter">
            <option value="5">Besser als 5 Meter (Sehr strikt)</option>
            <option value="10" selected>Besser als 10 Meter (Empfohlen)</option>
            <option value="20">Besser als 20 Meter (Locker)</option>
            <option value="999">Jede Genauigkeit zulassen</option>
        </select>

        <button id="trackBtn">📍 Position erfassen & Messung speichern</button>
        <button id="toggleLineBtn" class="btn-secondary">Start: Tiefenlinie zeichnen</button>
        
        <div id="map"></div>
    </div>

    <div class="card">
        <h3>Datenverwaltung</h3>
        <div class="btn-group">
            <button id="exportBtn" class="btn-secondary">📥 Daten exportieren</button>
            <div class="file-input-wrapper">
                <button class="btn-secondary" style="width: 100%;">📤 Daten importieren</button>
                <input type="file" id="importInput" accept=".json">
            </div>
        </div>
        <button id="clearBtn" class="btn-danger">🗑️ Alle Daten löschen</button>
    </div>

    <div class="card" style="overflow-x: auto;">
        <h3>Gespeicherte Messpunkte</h3>
        <table id="datatable">
            <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Tiefe</th>
                    <th>Koordinaten (Genauigkeit)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamische Einträge -->
            </tbody>
        </table>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, currentSessionPoints = [], allLines = [], allMarkers = [];
        let isDrawingLine = false;
        let activeLinePolyline = null;

        // 1. Karte initialisieren
        map = L.map('map').setView([47.5, 14.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap-Mitwirkende'
        }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 16);
            }, null, { enableHighAccuracy: true });
        }

        // UI-Elemente
        const statusBox = document.getElementById('statusBox');
        const depthInput = document.getElementById('depthInput');
        const accuracyFilter = document.getElementById('accuracyFilter');
        const trackBtn = document.getElementById('trackBtn');
        const toggleLineBtn = document.getElementById('toggleLineBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importInput = document.getElementById('importInput');
        const clearBtn = document.getElementById('clearBtn');
        const datatableBody = document.querySelector('#datatable tbody');

        function showStatus(text, type) {
            statusBox.style.display = 'block';
            statusBox.className = `status ${type}`;
            statusBox.innerText = text;
            setTimeout(() => statusBox.style.display = 'none', 6000);
        }

        function loadSavedData() {
            const savedPoints = localStorage.getItem('water_tracker_points');
            const savedLines = localStorage.getItem('water_tracker_lines');
            
            if (savedPoints) {
                currentSessionPoints = JSON.parse(savedPoints);
                currentSessionPoints.forEach(p => addPointToMapAndTable(p));
            }
            if (savedLines) {
                allLines = JSON.parse(savedLines);
                allLines.forEach(line => {
                    L.polyline(line.coords, {color: '#ff3b30', weight: 4}).addTo(map)
                     .bindPopup(`Tiefenlinie erfasst am: ${line.timestamp}`);
                });
            }
        }

        function saveData() {
            localStorage.setItem('water_tracker_points', JSON.stringify(currentSessionPoints));
            localStorage.setItem('water_tracker_lines', JSON.stringify(allLines));
        }

        function addPointToMapAndTable(pointData) {
            const marker = L.circleMarker([pointData.lat, pointData.lng], {
                radius: 8,
                fillColor: '#007aff',
                color: '#fff',
                weight: 2,
                fillOpacity: 0.8
            }).addTo(map);
            
            const accText = pointData.acc ? ` (±${parseFloat(pointData.acc).toFixed(1)}m)` : '';
            marker.bindPopup(`<b>Tiefe: ${pointData.depth} m</b><br><small>${pointData.time}${accText}</small>`);
            
            marker.bindTooltip(`${pointData.depth}m`, {
                permanent: true,
                direction: 'top',
                className: 'depth-label',
                offset: [0, -5]
            });

            allMarkers.push(marker);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${pointData.time}</td>
                <td><strong>${pointData.depth} m</strong></td>
                <td>
                    <small>${pointData.lat.toFixed(5)}, ${pointData.lng.toFixed(5)}</small>
                    <span class="badge">±${parseFloat(pointData.acc || 0).toFixed(1)}m</span>
                </td>
            `;
            datatableBody.insertBefore(row, datatableBody.firstChild);
        }

        // GPS-Erfassung
        trackBtn.addEventListener('click', () => {
            const depth = depthInput.value;
            if (!depth) {
                showStatus('⚠️ Bitte gib zuerst eine Wassertiefe ein!', 'error');
                return;
            }

            if (!navigator.geolocation) {
                showStatus('❌ GPS wird von deinem Gerät nicht unterstützt.', 'error');
                return;
            }

            trackBtn.disabled = true;
            trackBtn.innerText = '📡 Signal wird präzisiert...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const maxAllowedAcc = parseFloat(accuracyFilter.value);

                    if (acc > maxAllowedAcc) {
                        trackBtn.disabled = false;
                        trackBtn.innerText = '📍 Position erfassen & Messung speichern';
                        showStatus(`❌ GPS-Signal zu ungenau (±${acc.toFixed(1)}m). Erforderlich: <${maxAllowedAcc}m. Bitte warte kurz oder ändere den Filter.`, 'error');
                        return;
                    }

                    const timestamp = new Date().toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                    const newPoint = { lat, lng, depth, time: timestamp, acc: acc };
                    
                    currentSessionPoints.push(newPoint);
                    
                    if (isDrawingLine && activeLinePolyline) {
                        activeLinePolyline.addLatLng([lat, lng]);
                        allLines[allLines.length - 1].coords.push([lat, lng]);
                    }

                    addPointToMapAndTable(newPoint);
                    saveData();
                    
                    map.setView([lat, lng], 17);
                    depthInput.value = '';
                    
                    trackBtn.disabled = false;
                    trackBtn.innerText = '📍 Position erfassen & Messung speichern';
                    showStatus(`✅ Gespeichert! GPS-Genauigkeit: ±${acc.toFixed(1)} Meter.`, 'success');
                },
                (error) => {
                    trackBtn.disabled = false;
                    trackBtn.innerText = '📍 Position erfassen & Messung speichern';
                    showStatus('❌ GPS-Fehler: ' + error.message, 'error');
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
            );
        });

        // Linien-Modus
        toggleLineBtn.addEventListener('click', () => {
            if (!isDrawingLine) {
                isDrawingLine = true;
                toggleLineBtn.innerText = '⏹️ Tiefenlinie beenden & speichern';
                toggleLineBtn.className = 'btn-danger';
                
                allLines.push({
                    timestamp: new Date().toLocaleString('de-DE'),
                    coords: []
                });
                
                activeLinePolyline = L.polyline([], {color: '#ff3b30', weight: 4}).addTo(map);
                showStatus('⚡ Linienaufzeichnung aktiv. Jeder neue GPS-Punkt wird verbunden.', 'success');
            } else {
                isDrawingLine = false;
                toggleLineBtn.innerText = 'Start: Tiefenlinie zeichnen';
                toggleLineBtn.className = 'btn-secondary';
                activeLinePolyline = null;
                saveData();
                showStatus('💾 Tiefenlinie sicher im Speicher abgelegt.', 'success');
            }
        });

        // Robuster Blob-Export
        exportBtn.addEventListener('click', () => {
            try {
                const exportData = {
                    points: currentSessionPoints,
                    lines: allLines
                };
                const jsonString = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                downloadAnchor.download = `gewaesser_track_${new Date().toISOString().slice(0,10)}.json`;
                
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                
                setTimeout(() => {
                    document.body.removeChild(downloadAnchor);
                    URL.revokeObjectURL(url);
                }, 100);
                
                showStatus('📥 Daten-Download gestartet!', 'success');
            } catch (err) {
                showStatus('❌ Fehler beim Exportieren der Daten: ' + err.message, 'error');
            }
        });

        // Import
        importInput.addEventListener('change', (e) => {
            const fileReader = new FileReader();
            fileReader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.points || parsed.lines) {
                        currentSessionPoints = parsed.points || [];
                        allLines = parsed.lines || [];
                        saveData();
                        
                        allMarkers.forEach(m => map.removeLayer(m));
                        datatableBody.innerHTML = '';
                        loadSavedData();
                        
                        showStatus('📥 Daten erfolgreich importiert!', 'success');
                    } else {
                        showStatus('❌ Ungültiges Dateiformat.', 'error');
                    }
                } catch (err) {
                    showStatus('❌ Fehler beim Lesen der Datei.', 'error');
                }
            };
            if(e.target.files.length > 0) fileReader.readAsText(e.target.files[0]);
        });

        // Löschen
        clearBtn.addEventListener('click', () => {
            if (confirm('Möchtest du wirklich alle aufgezeichneten Daten unwiderruflich löschen?')) {
                localStorage.clear();
                location.reload();
            }
        });

        loadSavedData();
    </script>
</body>
</html>
