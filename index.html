<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gewässer-Tracker</title>
    <!-- Leaflet CSS über unpkg CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f0f2f5; color: #333; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h1 { margin-top: 0; color: #007aff; font-size: 24px; text-align: center; }
        button { background: #007aff; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button:active { background: #0056b3; }
        .btn-secondary { background: #34c759; }
        .btn-secondary:active { background: #248a3d; }
        .btn-danger { background: #ff3b30; }
        .btn-danger:active { background: #c61a09; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        .status { padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: bold; background: #e5e5ea; }
        .error { background: #ffdee2; color: #ff3b30; border: 1px solid #ff3b30; }
        .success { background: #e3ffd9; color: #34c759; border: 1px solid #34c759; }
        
        /* Karten-Container mit fester CSS-Höhe */
        #map { height: 350px; width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ccc; z-index: 1; }
        
        .depth-label { background: rgba(0, 122, 255, 0.9); color: white; border: 1px solid white; border-radius: 4px; padding: 2px 5px; font-size: 11px; font-weight: bold; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f2f2f7; font-weight: 600; }
        .flex-buttons { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>📍 Gewässer-Tracker</h1>
    <div id="statusBar" class="status">Bereit zum Erfassen</div>
    <button id="gpsBtn">1. GPS-Position erfassen</button>
    <div style="margin: 15px 0; line-height: 1.6; font-size: 14px;">
        <strong>Breitengrad (Lat):</strong> <span id="latText">-</span> | 
        <strong>Längengrad (Lng):</strong> <span id="lngText">-</span><br>
        <strong>Genauigkeit:</strong> <span id="accText">-</span>
    </div>
    <label for="depthInput"><strong>2. Wassertiefe (in Metern):</strong></label>
    <input type="number" id="depthInput" step="0.1" placeholder="z.B. 4.5" pattern="[0-9]*" inputmode="decimal">
    <button id="saveBtn" class="btn-secondary" disabled>3. Punkt speichern</button>
</div>

<div class="card">
    <h3>🗺️ Deine Gewässerkarte</h3>
    <div id="map"></div>
</div>

<div class="card">
    <h3>Gespeicherte Punkte (<span id="countText">0</span>)</h3>
    <div class="flex-buttons">
        <button id="exportBtn" style="background: #5856d6;">📊 Als CSV exportieren</button>
        <button id="clearBtn" class="btn-danger">⚠️ Alle löschen</button>
    </div>
    <div style="overflow-x:auto;">
        <table id="pointsTable">
            <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Lat</th>
                    <th>Lng</th>
                    <th>Tiefe</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Leaflet JavaScript Bibliothek -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var currentLat = null;
var currentLng = null;
var savedPoints = JSON.parse(localStorage.getItem('fishMapPoints')) || [];
var map = null;
var markerLayer = null;

var statusBar = document.getElementById('statusBar');
var latText = document.getElementById('latText');
var lngText = document.getElementById('lngText');
var accText = document.getElementById('accText');
var depthInput = document.getElementById('depthInput');
var gpsBtn = document.getElementById('gpsBtn');
var saveBtn = document.getElementById('saveBtn');
var exportBtn = document.getElementById('exportBtn');
var clearBtn = document.getElementById('clearBtn');
var pointsTable = document.getElementById('pointsTable').getElementsByTagName('tbody');
var countText = document.getElementById('countText');

// Einfache, fehlerfreie Initialisierung
function initMap() {
    try {
        map = L.map('map').setView([47.5, 13.5], 6); // Zentriert auf Österreich/Mitteleuropa
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        markerLayer = L.layerGroup().addTo(map);
        updateMapMarkers();
    } catch (e) {
        alert("Karten-Fehler: " + e.message);
    }
}

function updateMapMarkers() {
    if (!map || !markerLayer) return;
    markerLayer.clearLayers();
    
    if (savedPoints.length === 0) return;
    
    var lastPos = null;
    
    savedPoints.forEach(function(p) {
        lastPos = [p.lat, p.lng];
        L.marker(lastPos)
            .addTo(markerLayer)
            .bindPopup('<b>Zeit:</b> ' + p.time + '<br><b>Tiefe:</b> ' + p.depth + 'm')
            .bindTooltip(p.depth + 'm', {
                permanent: true, 
                direction: 'top',
                offset: [0, -10]
            });
    });
    
    // Setzt den Kartenausschnitt ausfallsicher auf die Position des zuletzt gesetzten Punktes
    if (lastPos !== null) {
        map.setView(lastPos, 16);
    }
}

function updateTable() {
    pointsTable.innerHTML = '';
    countText.innerText = savedPoints.length;
    savedPoints.forEach(function(p) {
        var row = pointsTable.insertRow(0);
        row.insertCell(0).innerText = p.time;
        row.insertCell(1).innerText = p.lat.toFixed(5);
        row.insertCell(2).innerText = p.lng.toFixed(5);
        row.insertCell(3).innerText = p.depth + 'm';
    });
}

gpsBtn.addEventListener('click', function() {
    statusBar.className = "status";
    statusBar.innerText = "Suche Satelliten...";
    
    if (!navigator.geolocation) {
        statusBar.className = "status error";
        statusBar.innerText = "GPS nicht unterstützt!";
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        function(position) {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            latText.innerText = currentLat.toFixed(5);
            lngText.innerText = currentLng.toFixed(5);
            accText.innerText = "+/- " + Math.round(position.coords.accuracy) + " Meter";
            statusBar.className = "status success";
            statusBar.innerText = "Position erfasst!";
            saveBtn.disabled = false;
            
            if (map) {
                map.setView([currentLat, currentLng], 16);
            }
            depthInput.focus();
        },
        function(error) {
            statusBar.className = "status error";
            statusBar.innerText = "Fehler: " + error.message;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
});

saveBtn.addEventListener('click', function() {
    var depth = depthInput.value.trim();
    if (!depth || isNaN(depth)) {
        alert("Bitte eine gültige Wassertiefe eintragen!");
        return;
    }
    
    var now = new Date();
    var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    var point = { time: timeStr, lat: currentLat, lng: currentLng, depth: depth };
    
    savedPoints.push(point);
    localStorage.setItem('fishMapPoints', JSON.stringify(savedPoints));
    
    updateTable();
    
    // Karte aufwecken und sofort synchronisieren (Live-Refresh)
    if (map) {
        map.invalidateSize();
    }
    updateMapMarkers();
    
    depthInput.value = '';
    saveBtn.disabled = true;
    latText.innerText = '-';
    lngText.innerText = '-';
    accText.innerText = '-';
    currentLat = null;
    currentLng = null;
    statusBar.className = "status";
    statusBar.innerText = "Punkt gespeichert!";
});

exportBtn.addEventListener('click', function() {
    if (savedPoints.length === 0) {
        alert("Keine Punkte zum Exportieren!");
        return;
    }
    var csvContent = "data:text/csv;charset=utf-8,Zeit,Lat,Lng,Tiefe(m)\n";
    savedPoints.forEach(function(p) { csvContent += p.time + "," + p.lat + "," + p.lng + "," + p.depth + "\n"; });
    var encodedUri = encodeURI(csvContent);
    var link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "gewaesser_karte.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});

clearBtn.addEventListener('click', function() {
    if (confirm("Wirklich alle Punkte löschen?")) {
        savedPoints = [];
        localStorage.removeItem('fishMapPoints');
        updateTable();
        updateMapMarkers();
        statusBar.className = "status";
        statusBar.innerText = "Daten gelöscht.";
    }
});

// App-Start
initMap();
updateTable();
</script>
</body>
</html>
